version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: "host"
    depends_on:
      - mongodb
    environment:
      # In host mode, services on the same host communicate via localhost
      - MONGO_URI=mongodb://localhost:27017/hydroponics_v5
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persist firmware and logs
      - ./firmware:/app/firmware
      - ./logs:/app/logs
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: "host"
    depends_on:
      - backend
    restart: always

  # Simulator is optional on RPi, but good for testing IO without sensors attached
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    network_mode: "host"
    environment:
      - API_URL=http://localhost:3000
    profiles:
      - sim
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    network_mode: "host"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
