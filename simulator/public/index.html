<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydroponics Simulator - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .card h2 {
            margin-bottom: 20px;
            color: #00d9ff;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sensor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sensor-row:last-child {
            border-bottom: none;
        }
        .sensor-label {
            font-weight: 500;
            color: #aaa;
        }
        .sensor-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #4ade80;
        }
        input[type="range"] {
            width: 150px;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00d9ff;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
            text-align: center;
        }
        .relay-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .toggle {
            position: relative;
            width: 60px;
            height: 30px;
            cursor: pointer;
        }
        .toggle input {
            display: none;
        }
        .toggle .slider {
            position: absolute;
            inset: 0;
            background: #333;
            border-radius: 30px;
            transition: 0.3s;
        }
        .toggle .slider::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle input:checked + .slider {
            background: #4ade80;
        }
        .toggle input:checked + .slider::before {
            transform: translateX(30px);
        }
        .scenario-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .scenario-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .scenario-btn.stop {
            background: linear-gradient(135deg, #f43f5e 0%, #ef4444 100%);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .status-online {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .status-offline {
            background: rgba(244, 63, 94, 0.2);
            color: #f43f5e;
        }
        .log-container {
            background: #0d0d0d;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        .log-in { color: #60a5fa; }
        .log-out { color: #4ade80; }
        .log-error { color: #f43f5e; }
        #uptime {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🌱 Hydroponics Hardware Simulator</h1>
    
    <div class="container">
        <!-- Status Card -->
        <div class="card">
            <h2>📡 Status</h2>
            <div class="sensor-row">
                <span class="sensor-label">Connection</span>
                <span class="status-badge status-online" id="status">Online</span>
            </div>
            <div class="sensor-row">
                <span class="sensor-label">Uptime</span>
                <span id="uptime">0s</span>
            </div>
            <div class="sensor-row">
                <span class="sensor-label">UDP Port</span>
                <span>8888</span>
            </div>
        </div>

        <!-- Sensors Card -->
        <div class="card">
            <h2>🌡️ Sensors</h2>
            <div class="sensor-row">
                <span class="sensor-label">pH</span>
                <input type="number" id="sensor-pH" value="6.5" step="0.1" min="0" max="14" onchange="updateSensor('pH', this.value)">
            </div>
            <div class="sensor-row">
                <span class="sensor-label">EC (mS/cm)</span>
                <input type="number" id="sensor-EC" value="1.8" step="0.1" min="0" max="10" onchange="updateSensor('EC', this.value)">
            </div>
            <div class="sensor-row">
                <span class="sensor-label">Temperature (°C)</span>
                <input type="number" id="sensor-temperature" value="24" step="0.5" min="0" max="50" onchange="updateSensor('temperature', this.value)">
            </div>
            <div class="sensor-row">
                <span class="sensor-label">Humidity (%)</span>
                <input type="number" id="sensor-humidity" value="60" step="1" min="0" max="100" onchange="updateSensor('humidity', this.value)">
            </div>
            <div class="sensor-row">
                <span class="sensor-label">Water Level (%)</span>
                <input type="number" id="sensor-waterLevel" value="75" step="1" min="0" max="100" onchange="updateSensor('waterLevel', this.value)">
            </div>
            <div class="sensor-row">
                <span class="sensor-label">Light (lux)</span>
                <input type="number" id="sensor-light" value="500" step="50" min="0" max="10000" onchange="updateSensor('light', this.value)">
            </div>
        </div>

        <!-- Relays Card -->
        <div class="card">
            <h2>⚡ Relays</h2>
            <div id="relays-container">
                <!-- Relay toggles will be added dynamically -->
            </div>
        </div>

        <!-- Scenarios Card -->
        <div class="card">
            <h2>🎬 Scenarios</h2>
            <div id="scenarios-container">
                <button class="scenario-btn" onclick="startScenario('ph_drift')">📉 pH Drift Down</button>
                <button class="scenario-btn" onclick="startScenario('connection_test')">🔌 Connection Dropout</button>
                <button class="scenario-btn" onclick="startScenario('random_fluctuation')">🎲 Random Fluctuation</button>
                <button class="scenario-btn stop" onclick="stopScenario()">⏹️ Stop Scenario</button>
            </div>
        </div>

        <!-- Command Log Card -->
        <div class="card" style="grid-column: span 2;">
            <h2>📜 Command Log</h2>
            <div class="log-container" id="log-container">
                <div class="log-entry">Simulator started...</div>
            </div>
        </div>
    </div>

    <script>
        // Create relay toggles
        const relayPins = ['D4_4', 'D5_5', 'D6_6', 'D7_7', 'D8_8'];
        const relaysContainer = document.getElementById('relays-container');
        
        relayPins.forEach(pin => {
            const row = document.createElement('div');
            row.className = 'relay-row';
            row.innerHTML = `
                <span class="sensor-label">Relay ${pin}</span>
                <label class="toggle">
                    <input type="checkbox" id="relay-${pin}" onchange="toggleRelay('${pin}', this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            relaysContainer.appendChild(row);
        });

        // API functions
        async function updateSensor(name, value) {
            try {
                await fetch(`/api/sensor/${name}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: parseFloat(value) })
                });
                addLog(`Sensor ${name} = ${value}`, 'out');
            } catch (e) {
                addLog(`Error updating ${name}`, 'error');
            }
        }

        async function toggleRelay(pin, state) {
            try {
                await fetch(`/api/relay/${pin}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ state: state ? 1 : 0 })
                });
                addLog(`Relay ${pin} = ${state ? 'ON' : 'OFF'}`, 'out');
            } catch (e) {
                addLog(`Error toggling ${pin}`, 'error');
            }
        }

        async function startScenario(name) {
            try {
                await fetch(`/api/scenario/${name}/start`, { method: 'POST' });
                addLog(`Started scenario: ${name}`, 'in');
            } catch (e) {
                addLog(`Error starting scenario`, 'error');
            }
        }

        async function stopScenario() {
            try {
                await fetch('/api/scenario/stop', { method: 'POST' });
                addLog('Stopped scenario', 'in');
            } catch (e) {
                addLog('Error stopping scenario', 'error');
            }
        }

        function addLog(message, type = 'in') {
            const container = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${time}] ${message}`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
            
            // Keep only last 100 entries
            while (container.children.length > 100) {
                container.removeChild(container.firstChild);
            }
        }

        // Polling for state updates
        async function refreshState() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                
                // Update uptime
                document.getElementById('uptime').textContent = 
                    Math.floor(state.uptime / 1000) + 's';
                
                // Update sensors
                for (const [name, sensor] of Object.entries(state.sensors)) {
                    const input = document.getElementById(`sensor-${name}`);
                    if (input) {
                        input.value = sensor.value.toFixed(1);
                    }
                }
                
                // Update relays
                for (const [pin, relay] of Object.entries(state.relays)) {
                    const checkbox = document.getElementById(`relay-${pin}`);
                    if (checkbox) {
                        checkbox.checked = relay.state === 1;
                    }
                }

                // Update status
                const statusEl = document.getElementById('status');
                if (state.isOffline) {
                    statusEl.textContent = 'Offline';
                    statusEl.className = 'status-badge status-offline';
                } else {
                    statusEl.textContent = 'Online';
                    statusEl.className = 'status-badge status-online';
                }
            } catch (e) {
                console.error('Failed to refresh state', e);
            }
        }

        // Refresh every 500ms
        setInterval(refreshState, 500);
        refreshState();
    </script>
</body>
</html>
